name: Publish to BCR
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "The release tag to publish (e.g., v1.2.3)"
        required: true
        type: string
jobs:
  publish:
    permissions:
      contents: write
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@ca23149e55cd4db07a6bcce69c02dea314c5a357 # v1.5.0
    with:
      tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.event.release.tag_name }}
      registry_fork: cgrindel/bazel-central-registry
      attest: false
      author_name: Chuck Grindel
      author_email: chuckgrindel@gmail.com
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
